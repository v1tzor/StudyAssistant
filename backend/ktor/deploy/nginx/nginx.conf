user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format studyassistant '$remote_addr - $request_id [$time_local] '
        '"$request" $status $body_bytes_sent "$http_user_agent" '
        'request_time=$request_time upstream_time=$upstream_response_time';

    access_log /dev/stdout studyassistant;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    server_names_hash_bucket_size 64;

    include /etc/nginx/studyassistant/00-studyassistant-zones.conf;
    include /etc/nginx/studyassistant/01-default-deny.conf;
    include /etc/nginx/studyassistant/api.studyassistant-app.ru.conf;
}
