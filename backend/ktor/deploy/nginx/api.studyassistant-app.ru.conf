server {
    listen 80;
    listen [::]:80;
    server_name api.studyassistant-app.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://api.studyassistant-app.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.studyassistant-app.ru;

    ssl_certificate /etc/letsencrypt/live/api.studyassistant-app.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.studyassistant-app.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_ecdh_curve X25519:secp256r1;
    ssl_session_cache shared:StudyAssistantTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    default_type application/json;
    ignore_invalid_headers on;
    underscores_in_headers off;
    client_max_body_size 1100k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    send_timeout 15s;
    reset_timedout_connection on;

    limit_conn studyassistant_connections 20;
    limit_conn_status 429;
    limit_req_status 429;

    error_page 413 = @payload_too_large;
    error_page 429 = @rate_limited;

    location @payload_too_large {
        return 413 '{"errorCode":"too_large"}';
    }

    location @rate_limited {
        return 429 '{"errorCode":"rate_limit"}';
    }

    include /etc/nginx/studyassistant/snippets/studyassistant-security-headers.conf;

    location = /api/v1/installations/register {
        if ($request_method != POST) {
            return 405 '{"errorCode":"method_not_allowed"}';
        }

        client_max_body_size 1;
        limit_conn studyassistant_registration_connections 2;
        limit_req zone=studyassistant_registration burst=2 nodelay;
        limit_req zone=studyassistant_registration_global burst=20 nodelay;
        include /etc/nginx/studyassistant/snippets/studyassistant-proxy.conf;
    }

    location ^~ /api/v1/ai/ {
        if ($request_method != POST) {
            return 405 '{"errorCode":"method_not_allowed"}';
        }

        client_max_body_size 256k;
        limit_conn studyassistant_ai_connections 3;
        limit_req zone=studyassistant_ai burst=10 nodelay;
        limit_req zone=studyassistant_ai_sustained burst=20 nodelay;
        limit_req zone=studyassistant_ai_global burst=100 nodelay;
        include /etc/nginx/studyassistant/snippets/studyassistant-proxy.conf;
    }

    location ^~ /api/v1/ad-rewards/ {
        if ($request_method != POST) {
            return 405 '{"errorCode":"method_not_allowed"}';
        }

        client_max_body_size 16k;
        limit_conn studyassistant_ad_rewards_connections 5;
        limit_req zone=studyassistant_general burst=20 nodelay;
        limit_req zone=studyassistant_ad_rewards burst=10 nodelay;
        limit_req zone=studyassistant_ad_rewards_global burst=100 nodelay;
        include /etc/nginx/studyassistant/snippets/studyassistant-proxy.conf;
    }

    location = /api/v1/shares/homework/create {
        if ($request_method != POST) {
            return 405 '{"errorCode":"method_not_allowed"}';
        }

        limit_conn studyassistant_sharing_connections 5;
        limit_req zone=studyassistant_general burst=20 nodelay;
        limit_req zone=studyassistant_sharing burst=30 nodelay;
        limit_req zone=studyassistant_sharing_global burst=100 nodelay;
        limit_req zone=studyassistant_share_create burst=10 nodelay;
        limit_req zone=studyassistant_share_create_global burst=30 nodelay;
        include /etc/nginx/studyassistant/snippets/studyassistant-proxy.conf;
    }

    location = /api/v1/shares/schedule/create {
        if ($request_method != POST) {
            return 405 '{"errorCode":"method_not_allowed"}';
        }

        limit_conn studyassistant_sharing_connections 5;
        limit_req zone=studyassistant_general burst=20 nodelay;
        limit_req zone=studyassistant_sharing burst=30 nodelay;
        limit_req zone=studyassistant_sharing_global burst=100 nodelay;
        limit_req zone=studyassistant_share_create burst=10 nodelay;
        limit_req zone=studyassistant_share_create_global burst=30 nodelay;
        include /etc/nginx/studyassistant/snippets/studyassistant-proxy.conf;
    }

    location ^~ /api/v1/shares/ {
        if ($request_method != POST) {
            return 405 '{"errorCode":"method_not_allowed"}';
        }

        limit_conn studyassistant_sharing_connections 5;
        limit_req zone=studyassistant_general burst=20 nodelay;
        limit_req zone=studyassistant_sharing burst=30 nodelay;
        limit_req zone=studyassistant_sharing_global burst=100 nodelay;
        include /etc/nginx/studyassistant/snippets/studyassistant-proxy.conf;
    }

    location ^~ /health/ {
        if ($request_method != GET) {
            return 405 '{"errorCode":"method_not_allowed"}';
        }

        limit_req zone=studyassistant_general burst=10 nodelay;
        include /etc/nginx/studyassistant/snippets/studyassistant-proxy.conf;
    }

    location / {
        return 404 '{"errorCode":"not_found"}';
    }
}
