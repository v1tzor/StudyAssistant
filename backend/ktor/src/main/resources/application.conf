ktor {
    deployment {
        host = "0.0.0.0"

        port = 8080
        port = ${?PORT}

        shutdownGracePeriod = 10000
        shutdownTimeout = 30000

        connectionGroupSize = 1
        connectionGroupSize = ${?KTOR_CONNECTION_GROUP_SIZE}

        workerGroupSize = 2
        workerGroupSize = ${?KTOR_WORKER_GROUP_SIZE}

        callGroupSize = 4
        callGroupSize = ${?KTOR_CALL_GROUP_SIZE}
    }

    application {
        modules = [
            ru.aleshin.studyassistant.backend.ApplicationKt.module
        ]
    }
}

database {
    jdbcUrl = ${DATABASE_URL}
    user = ${DATABASE_USER}
    password = ${?DATABASE_PASSWORD}

    maximumPoolSize = 5
    maximumPoolSize = ${?DATABASE_MAXIMUM_POOL_SIZE}
    connectionTimeoutMs = 5000
    statementTimeoutMs = 125000
    idleTransactionTimeoutMs = 30000
    maxLifetimeMs = 1800000
}

security {
    installationHmacSecret = ${?INSTALLATION_HMAC_SECRET}
    shareHmacSecret = ${?SHARE_HMAC_SECRET}
    payloadEncryptionKey = ${?PAYLOAD_ENCRYPTION_KEY}
}

httpSecurity {
    expectedHost = ${?EXPECTED_HOST}
    trustProxyHeaders = ${?TRUST_PROXY_HEADERS}
    requireHttps = ${?REQUIRE_HTTPS}
}

installation {
    registrationLimitPerNetworkPerDay = 10
    globalRegistrationLimitPerDay = 1000
}

sharing {
    maxRequestBodyBytes = 1100000
    maxPayloadBytes = 1048576
    maxItemsPerShare = 20

    homeworkLifetimeHours = 24

    scheduleLifetimeMinutes = 30
    scheduleClaimLifetimeMinutes = 10

    createLimitPerHour = 10
    createdItemsLimitPerDay = 200
    activeHomeworkItemsLimit = 200
    activePayloadBytesLimitPerInstallation = 10485760
    createdPayloadBytesLimitPerDay = 20971520
    globalActivePayloadBytesLimit = 536870912
    globalCreatedPayloadBytesLimitPerDay = 268435456

    codeLookupLimit = 30
    codeLookupWindowMinutes = 10
}

ai {
    dailyMessageLimit = 12
    rewardedMessageAmount = 12
    maxRewardedResetsPerDay = 3
    rewardChallengeLifetimeMinutes = 15
    globalDailyExecutionLimit = 500
    globalDailyExecutionLimit = ${?AI_GLOBAL_DAILY_EXECUTION_LIMIT}

    executionLimit = 30
    maxExecutionsPerMessage = 8
    maxConcurrentExecutionsPerInstallation = 2
    executionWindowMinutes = 60

    reservationTimeoutMinutes = 5

    maxRequestBodyBytes = 262144
    maxMessages = 80
    maxMessageCharacters = 32768
    maxTotalContentCharacters = 131072
    maxTools = 32
    maxToolDescriptionCharacters = 2048
    maxToolSchemaCharacters = 16384
    maxToolCallsPerMessage = 16
    maxToolArgumentsCharacters = 16384
    maxScheduleRequestBodyBytes = 1048576
    maxScheduleImageBytes = 786432
    maxScheduleNoteCharacters = 120
    maxScheduleEntries = 300
    maxScheduleFieldCharacters = 512
    maxScheduleUnparsedLines = 100

    openrouter {
        apiKey = ${?OPENROUTER_API_KEY}

        baseUrl = "https://openrouter.ai/api/v1"

        maxTokens = 8192
        maxResponseBodyBytes = 524288

        totalTimeoutMs = 180000
        requestTimeoutMs = 120000
        connectTimeoutMs = 5000
        socketTimeoutMs = 120000

        maxRetries = 2
        baseRetryDelayMs = 500
        maxRetryDelayMs = 5000
        retryJitterMs = 250
        maxConcurrentRequests = 8
        maxConcurrentRequests = ${?OPENROUTER_MAX_CONCURRENT_REQUESTS}
        queueTimeoutMs = 3000

        socksHost = "127.0.0.1"
        socksHost = ${?OPENROUTER_SOCKS_HOST}
        socksPort = 10808
        socksPort = ${?OPENROUTER_SOCKS_PORT}
    }

    deepseek {
        apiKey = ${?DEEPSEEK_API_KEY}

        baseUrl = "https://api.deepseek.com"

        maxTokens = 8192
        maxResponseBodyBytes = 524288

        totalTimeoutMs = 120000
        requestTimeoutMs = 60000
        connectTimeoutMs = 5000
        socketTimeoutMs = 60000

        maxRetries = 2
        baseRetryDelayMs = 500
        maxRetryDelayMs = 5000
        retryJitterMs = 250
        maxConcurrentRequests = 16
        maxConcurrentRequests = ${?DEEPSEEK_MAX_CONCURRENT_REQUESTS}
        queueTimeoutMs = 3000
    }
}
